<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Fit</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e3e3de;
    --accent: #2f5bd3; --ok: #1f7a4d; --ok-bg: #e6f4ec; --gap: #b4442c; --gap-bg: #fbeae5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ececea; --muted: #9a9a94; --border: #33332f;
      --accent: #7f9cf5; --ok: #6fcf9a; --ok-bg: #1b3326; --gap: #f08a72; --gap-bg: #3a211b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input, textarea, select { width: 100%; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
  textarea { min-height: 220px; resize: vertical; margin-top: 12px; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .status { color: var(--muted); font-size: 14px; }
  .error { color: var(--gap); }
  .past { display: flex; gap: 8px; align-items: center; }
  .past select { flex: 1; }
  .summary { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .score { font-size: 32px; font-weight: 700; }
  .bar { height: 8px; background: var(--gap-bg); border-radius: 4px; overflow: hidden; margin: 12px 0 4px; }
  .bar > div { height: 100%; background: var(--ok); }
  .req { border-top: 1px solid var(--border); padding: 14px 0; }
  .req-head { display: flex; gap: 10px; align-items: flex-start; }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
  .tag.ok { color: var(--ok); background: var(--ok-bg); }
  .tag.gap { color: var(--gap); background: var(--gap-bg); }
  .nice { color: var(--muted); font-size: 13px; }
  details { margin: 6px 0 0 0; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .hit { display: grid; grid-template-columns: 48px 1fr; gap: 8px; font-size: 14px; margin-top: 8px; }
  .sim { font-variant-numeric: tabular-nums; font-weight: 600; }
  .role { color: var(--muted); font-size: 12px; }
  .cost { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .filters { display: flex; gap: 8px; margin: 12px 0 0; }
  .filters button { background: transparent; color: var(--muted); border: 1px solid var(--border); padding: 4px 12px; font-weight: 500; }
  .filters button.on { color: var(--text); border-color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Job Fit</h1>
  <p class="sub">Paste a job posting to see which requirements your resume backs up and which are gaps.</p>

  <section class="panel">
    <form id="form">
      <div class="row">
        <div><label for="company">Company</label><input id="company" required></div>
        <div><label for="title">Job title</label><input id="title" required></div>
      </div>
      <textarea id="description" placeholder="Paste the full job description here" required></textarea>
      <div class="actions">
        <button id="go" type="submit">Check fit</button>
        <span id="status" class="status"></span>
      </div>
    </form>
  </section>

  <section class="panel past">
    <select id="past"><option value="">Previously checked postings…</option></select>
  </section>

  <section id="report" class="panel" hidden></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let current = null;
let filter = 'all';

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function loadPast(selected) {
  const postings = await api('/api/postings');
  $('past').innerHTML = '<option value="">Previously checked postings…</option>' +
    postings.map((p) => `<option value="${esc(p.id)}"${p.id === selected ? ' selected' : ''}>${esc(p.company)} — ${esc(p.title)}</option>`).join('');
}

function render() {
  const r = current;
  const shown = r.results.filter((x) => filter === 'all' || (filter === 'gap') !== x.supported);
  const supported = r.results.filter((x) => x.supported).length;
  const required = r.results.filter((x) => x.kind === 'required');
  const reqSupported = required.filter((x) => x.supported).length;
  const pct = r.results.length ? Math.round((supported / r.results.length) * 100) : 0;

  $('report').hidden = false;
  $('report').innerHTML = `
    <div class="summary">
      <div class="score">${supported}/${r.results.length}</div>
      <div><strong>${esc(r.company)} — ${esc(r.title)}</strong><br>
        <span class="status">${reqSupported}/${required.length} required · threshold ${r.threshold} · <code>${esc(r.id)}</code></span></div>
    </div>
    ${r.usage ? `<div class="cost">Claude call: ${r.usage.inputTokens.toLocaleString()} input + ${r.usage.outputTokens.toLocaleString()} output tokens on <code>${esc(r.usage.model)}</code>${
      r.usage.costUsd === null ? ' (no price on file for this model)' : ` · <strong>$${r.usage.costUsd.toFixed(4)}</strong>`}</div>` : ''}
    <div class="bar"><div style="width:${pct}%"></div></div>
    <div class="filters">
      ${['all', 'supported', 'gap'].map((f) => `<button data-f="${f}" class="${f === filter ? 'on' : ''}">${f[0].toUpperCase() + f.slice(1)}</button>`).join('')}
    </div>
    ${shown.map((x) => `
      <div class="req">
        <div class="req-head">
          <span class="tag ${x.supported ? 'ok' : 'gap'}">${x.supported ? 'SUPPORTED' : 'GAP'}</span>
          <div>${esc(x.text)} ${x.kind === 'nice_to_have' ? '<span class="nice">(nice to have)</span>' : ''}</div>
        </div>
        <details>
          <summary>Closest resume bullets</summary>
          ${x.hits.map((h) => `
            <div class="hit"><span class="sim">${h.similarity.toFixed(2)}</span>
              <div>${esc(h.text)}<div class="role">${esc(h.role)}</div></div></div>`).join('')}
        </details>
      </div>`).join('')}`;

  $('report').querySelectorAll('.filters button').forEach((b) =>
    b.addEventListener('click', () => { filter = b.dataset.f; render(); }));
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true;
  $('status').className = 'status';
  $('status').textContent = 'Extracting requirements with Claude and matching… (first run downloads the embedding model)';
  try {
    current = await api('/api/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company: $('company').value, title: $('title').value, description: $('description').value }),
    });
    filter = 'all';
    render();
    $('status').textContent = '';
    await loadPast(current.id);
  } catch (err) {
    $('status').className = 'status error';
    $('status').textContent = err.message;
  } finally {
    $('go').disabled = false;
  }
});

$('past').addEventListener('change', async () => {
  if (!$('past').value) return;
  try {
    current = await api('/api/report?id=' + encodeURIComponent($('past').value));
    filter = 'all';
    render();
  } catch (err) {
    $('status').className = 'status error';
    $('status').textContent = err.message;
  }
});

loadPast().catch((err) => { $('status').className = 'status error'; $('status').textContent = err.message; });
</script>
</body>
</html>
